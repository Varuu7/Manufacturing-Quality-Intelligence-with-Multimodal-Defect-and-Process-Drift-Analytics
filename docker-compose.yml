version: '3.8'

services:
  quality-intelligence:
    build: .
    container_name: mfg_quality_intelligence
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped
